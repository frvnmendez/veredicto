name: validate
on: [push, pull_request]
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON válido
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Frontmatter de skills y agentes
        run: |
          for f in skills/*/SKILL.md agents/*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "Falta frontmatter: $f"; exit 1; }
            grep -q '^name:' "$f" || { echo "Falta name: $f"; exit 1; }
            grep -q '^description:' "$f" || { echo "Falta description: $f"; exit 1; }
          done
